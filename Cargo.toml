[package]
name = "herdr-find"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server that finds a running Herdr agent session by what it's about and focuses its pane"
license = "MIT"
repository = "https://github.com/404wolf/herdr-find"
readme = "README.md"
keywords = ["mcp", "herdr", "claude", "codex", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "process", "time"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
